name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Test with coverage gate
        run: |
          CI=true yarn test --coverage --watchAll=false --coverageReporters=json-summary 2>&1 | tee /tmp/test-output.txt
          COVERAGE=$(python3 -c "
          import json, sys
          try:
            with open('coverage/coverage-summary.json') as f:
              d = json.load(f)
            lines = d['total']['lines']['pct']
            branches = d['total']['branches']['pct']
            print(f'{int(lines)},{int(branches)}')
          except Exception as e:
            print('0,0')
          ")
          LINE_COV=$(echo $COVERAGE | cut -d',' -f1)
          BRANCH_COV=$(echo $COVERAGE | cut -d',' -f2)
          echo "Line coverage: ${LINE_COV}%"
          echo "Branch coverage: ${BRANCH_COV}%"
          if [ "${LINE_COV}" -lt 90 ]; then
            echo "❌ Line coverage ${LINE_COV}% is below 90% baseline."
            exit 1
          fi
          if [ "${BRANCH_COV}" -lt 90 ]; then
            echo "❌ Branch coverage ${BRANCH_COV}% is below 90% baseline."
            exit 1
          fi
          echo "✅ Coverage: lines ${LINE_COV}%, branches ${BRANCH_COV}% — both meet 90% baseline."
      - name: Build
        run: yarn build
        env:
          REACT_APP_API_URL: https://money-flow-backend-production.up.railway.app
          REACT_APP_VERSION: 1.0.0
          CI: false
      - name: Notify Telegram on success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ CI passed: money-flow-frontend (${{ github.ref_name }}) — ${{ github.event.head_commit.message }}"
      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ CI failed: money-flow-frontend (${{ github.ref_name }}) — ${{ github.event.head_commit.message }}"
