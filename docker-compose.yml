services:
  frontend:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./tsconfig.json:/app/tsconfig.json
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:3001}
      - WATCHPACK_POLLING=true
    profiles:
      - dev

  frontend-prod:
    build:
      context: .
      target: prod
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:3001}
    ports:
      - "80:80"
    profiles:
      - prod
